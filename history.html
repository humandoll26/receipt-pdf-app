<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>領収書履歴一覧</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Receipt History</p>
      <h1>保存済み履歴</h1>
      <p class="lead">更新日時の新しい順で保存済みの領収書を表示します。</p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <a class="button button-secondary" href="./index.html">新規発行へ</a>
        <a class="button button-ghost" href="./guide.html">使い方と保存仕様</a>
        <label class="field search-field">
          <span>取り込みモード</span>
          <select id="import-mode-select">
            <option value="skip">新しいものだけ追加する</option>
            <option value="merge">上書きしながら取り込む</option>
            <option value="replace">現在の履歴を置き換える</option>
          </select>
        </label>
        <button id="export-json-button" class="button button-secondary" type="button">JSON書き出し</button>
        <button id="import-json-button" class="button button-secondary" type="button">JSON読み込み</button>
        <button id="select-all-button" class="button button-ghost" type="button">全選択</button>
        <button id="delete-selected-button" class="button button-danger" type="button" disabled>選択削除</button>
        <input id="import-json-input" type="file" accept="application/json" hidden>
      </div>
      <div class="toolbar">
        <label class="field search-field">
          <span>検索</span>
          <input id="history-search-input" type="search" placeholder="宛名、番号、発行日、発行者名で検索">
        </label>
      </div>
      <div id="history-error" class="alert alert-error" hidden></div>
      <div id="history-empty" class="empty" hidden>
        <p>保存済みの領収書はありません。</p>
      </div>
      <div id="history-list" class="history-list" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="./assets/js/history.js"></script>
</body>
</html>
