<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>領収書詳細</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Receipt Detail</p>
      <h1>領収書詳細</h1>
      <p class="lead">保存済みデータを編集し、再保存やPDF再生成ができます。</p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <a class="button button-secondary" href="./settings.html">発行者設定</a>
        <a class="button button-ghost" href="./guide.html">使い方と保存仕様</a>
      </div>
      <div id="detail-error" class="alert alert-error" hidden></div>
      <form id="detail-form" class="form" novalidate>
        <label class="field">
          <span>発行区分 <em>必須</em></span>
          <select name="invoiceIssuerStatus" required>
            <option value="invoice">インボイス対応あり</option>
            <option value="standard">通常の領収書</option>
          </select>
        </label>

        <label class="field">
          <span>宛名 <em>必須</em></span>
          <div class="field-inline">
            <input type="text" name="customerName" required>
            <span class="field-suffix">様</span>
          </div>
        </label>

        <label class="field">
          <span>金額 <em>必須</em></span>
          <input type="number" name="amount" inputmode="numeric" min="0" step="1" required>
          <small class="field-help" data-amount-preview>¥0</small>
        </label>

        <label class="field invoice-field">
          <span>税率区分 <em>必須</em></span>
          <select name="taxCategory" required>
            <option value="10">10% 対象</option>
            <option value="8">8% 対象</option>
            <option value="0">非課税</option>
          </select>
        </label>

        <label class="field invoice-field">
          <span>税計算方式 <em>必須</em></span>
          <select name="taxMode" required>
            <option value="inclusive">内税</option>
            <option value="exclusive">外税</option>
          </select>
        </label>

        <label class="field">
          <span>但し書き <em>必須</em></span>
          <input type="text" name="purpose" required>
        </label>

        <label class="field">
          <span>発行日 <em>必須</em></span>
          <input type="date" name="issueDate" required>
        </label>

        <label class="field">
          <span>発行者名 <em>必須</em></span>
          <input type="text" name="issuerName" required>
        </label>

        <label class="field">
          <span>発行者住所</span>
          <textarea name="issuerAddress" rows="3"></textarea>
        </label>

        <label class="field invoice-field">
          <span>登録番号 <em>必須</em></span>
          <input type="text" name="issuerRegistrationNumber" placeholder="T1234567890123" value="T" maxlength="14" required>
        </label>

        <label class="field">
          <span>備考</span>
          <textarea name="note" rows="3"></textarea>
        </label>

        <div class="meta-block">
          <p id="detail-receipt-number"></p>
          <p id="detail-created-at"></p>
          <p id="detail-updated-at"></p>
        </div>

        <div class="actions">
          <button id="save-button" class="button button-primary" type="submit">更新保存</button>
          <button id="download-button" class="button button-secondary" type="button">PDF再生成</button>
          <button id="delete-button" class="button button-danger" type="button">削除</button>
          <a class="button button-ghost" href="./history.html">一覧へ戻る</a>
        </div>
      </form>
    </section>

    <section class="service-card" aria-labelledby="customize-title">
      <div class="service-card-head">
        <h2 id="customize-title">カスタマイズのご相談お受けしてます</h2>
        <span class="service-badge">custom work available</span>
      </div>
      <p>このツールをベースに、文言変更、項目追加、見た目調整、運用フローに合わせた軽い改修などを相談ベースで受けています。ゼロから大きく作るより、まず今ある型を土台にして素早く整えたいケース向けです。</p>
      <div class="service-actions">
        <a class="button button-primary" href="https://docs.google.com/forms/d/e/1FAIpQLSdiC1fGdMA0lqVVoyfGLT9gj6ySGYalV7INjXDvK4qUIppGjA/viewform?usp=publish-editor" target="_blank" rel="noreferrer">相談フォームはこちら</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="https://humandoll26.github.io/portfolio/" target="_blank" rel="noreferrer">未完製作所</a>
  </footer>

  <script type="module" src="./assets/js/detail.js"></script>
</body>
</html>
